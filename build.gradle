plugins { id 'java' }

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex('net\\.runelite.*') }
    }
    mavenCentral()
}

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: 'latest.release'
    testImplementation group: 'net.runelite', name: 'client', version: 'latest.release'
    testImplementation group: 'net.runelite', name: 'jshell', version: 'latest.release'
    testImplementation 'junit:junit:4.13.2'
}

group = 'com.eggcollection'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eggcollection.EggLauncher'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
    systemProperty 'eggscape.developerTools', 'true'
}

// Preview the normal player UI while loading the local plugin in RuneLite.
tasks.register('runRelease', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eggcollection.EggLauncher'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
    systemProperty 'eggscape.developerTools', 'false'
}

